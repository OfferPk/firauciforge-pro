<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d18" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="780" fill="url(#bgGrad)" />

  <!-- Window Header Bar -->
  <rect x="30" y="25" width="1140" height="65" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <circle cx="60" cy="57" r="7" fill="#ef4444" />
  <circle cx="82" cy="57" r="7" fill="#f59e0b" />
  <circle cx="104" cy="57" r="7" fill="#10b981" />

  <text x="140" y="63" font-size="20" font-weight="700" fill="#06b6d4" letter-spacing="1">FiRaUCIForge Pro</text>
  <text x="340" y="62" font-size="13" font-weight="500" fill="#94a3b8">| FiRa Consortium &amp; IEEE 802.15.4z UWB Command Interface Studio</text>
  <rect x="990" y="42" width="155" height="30" rx="6" fill="#0284c7" />
  <text x="1005" y="62" font-size="12" font-weight="600" fill="#ffffff">v1.0.0-PRO COMPLIANT</text>

  <!-- Left Column: Synthesizer & DS-TWR Ranging Engine -->
  <rect x="30" y="105" width="560" height="645" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
  <text x="55" y="140" font-size="17" font-weight="700" fill="#f8fafc">1. UCI Command Synthesizer &amp; Ranging</text>
  <text x="55" y="165" font-size="13" fill="#94a3b8">4-Byte Header [MT:3b | PBF:1b | GID:4b] [OID:6b] + Payload</text>

  <!-- Command Selector Box -->
  <rect x="55" y="185" width="510" height="42" rx="6" fill="#030712" stroke="#475569" stroke-width="1" />
  <text x="70" y="211" font-size="14" fill="#06b6d4" font-family="Courier, monospace">SESSION_SET_APP_CONFIG_CMD [GID: 0x01, OID: 0x03]</text>

  <!-- Telemetry Breakdown Grid -->
  <rect x="55" y="245" width="245" height="75" rx="6" fill="#030712" stroke="#334155" stroke-width="1" />
  <text x="70" y="270" font-size="12" fill="#94a3b8">Byte 0 (MT / PBF / GID)</text>
  <text x="70" y="298" font-size="18" font-weight="700" fill="#a855f7" font-family="Courier, monospace">0x21 (Cmd, GID: 1)</text>

  <rect x="320" y="245" width="245" height="75" rx="6" fill="#030712" stroke="#334155" stroke-width="1" />
  <text x="335" y="270" font-size="12" fill="#94a3b8">Byte 1 (Opcode ID)</text>
  <text x="335" y="298" font-size="18" font-weight="700" fill="#06b6d4" font-family="Courier, monospace">0x03 (Set App Config)</text>

  <!-- Raw Hex Stream Display -->
  <text x="55" y="355" font-size="14" font-weight="600" fill="#f8fafc">Framed UCI Byte Stream (SPI/UART):</text>
  <rect x="55" y="370" width="510" height="85" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1" />
  <text x="70" y="400" font-size="13" fill="#10b981" font-family="Courier, monospace" font-weight="700">21 03 00 0f 01 00 00 00 03 04 01 09 08 02 b0 04 0e 01 02</text>
  <text x="70" y="425" font-size="11" fill="#64748b" font-family="Courier, monospace">[21 03 00 0f] Header | [01 00 00 00] Sess ID: 1 | Ch 9 (8.0 GHz) | Dynamic STS</text>
  <text x="70" y="443" font-size="11" fill="#38bdf8" font-family="Courier, monospace">Slot: 1200µs (0x04B0) | Ranging Profile: CCC Digital Key Release 3</text>

  <!-- DS-TWR Ranging Results Box -->
  <text x="55" y="485" font-size="14" font-weight="600" fill="#f8fafc">Double-Sided Two-Way Ranging (DS-TWR) &amp; AoA:</text>
  <rect x="55" y="500" width="510" height="115" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1" />
  <text x="70" y="525" font-size="13" fill="#fbbf24" font-family="Courier, monospace">Time-of-Flight (ToF): 23.50 ns (Antenna Delay: 1.50 ns compensated)</text>
  <text x="70" y="555" font-size="16" fill="#10b981" font-family="Courier, monospace" font-weight="700">Calibrated Distance: 7.045 m (704.5 cm)</text>
  <text x="70" y="585" font-size="13" fill="#38bdf8" font-family="Courier, monospace">Angle of Arrival (AoA): +14.48° Azimuth (PDoA: 45.0°, Ch 9 λ: 37.5 mm)</text>

  <!-- C Firmware Array Export Box -->
  <rect x="55" y="635" width="510" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="70" y="658" font-size="12" fill="#fbbf24" font-family="Courier, monospace">static const uint8_t uci_session_cfg[] = {</text>
  <text x="85" y="680" font-size="11" fill="#cbd5e1" font-family="Courier, monospace">  0x21, 0x03, 0x00, 0x0F, 0x01, 0x00, 0x00, 0x00, 0x03, 0x04, 0x01, 0x09...</text>
  <text x="70" y="705" font-size="12" fill="#fbbf24" font-family="Courier, monospace">}; // 19 bytes SPI payload</text>

  <!-- Right Column: Protocol Dissector & 10-Point Normative Auditor -->
  <rect x="610" y="105" width="560" height="645" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
  <text x="635" y="140" font-size="17" font-weight="700" fill="#f8fafc">2. Zero-Trust Normative Auditor &amp; Dissector</text>
  <text x="635" y="165" font-size="13" fill="#94a3b8">FiRa Consortium &amp; IEEE 802.15.4z automated ruleset auditor</text>

  <!-- Dissector Results Card -->
  <rect x="635" y="185" width="510" height="135" rx="6" fill="#030712" stroke="#334155" stroke-width="1" />
  <text x="650" y="210" font-size="13" font-weight="700" fill="#06b6d4">DISSECTION REPORT: FiRa UCI Command Frame</text>
  <text x="650" y="233" font-size="12" fill="#cbd5e1">- Message Type: <tspan fill="#10b981" font-weight="700">0x01 (UCI Command Packet)</tspan></text>
  <text x="650" y="253" font-size="12" fill="#cbd5e1">- Group ID: <tspan fill="#06b6d4" font-weight="700">0x01 (Session Configuration)</tspan> | OID: <tspan fill="#a855f7" font-weight="700">0x03 (Set App Config)</tspan></text>
  <text x="650" y="273" font-size="12" fill="#cbd5e1">- Session ID: <tspan fill="#fbbf24" font-weight="700">0x00000001</tspan> | RF Channel: <tspan fill="#34d399" font-weight="700">Channel 9 (7987.2 MHz)</tspan></text>
  <text x="650" y="293" font-size="12" fill="#cbd5e1">- STS Mode: <tspan fill="#38bdf8" font-weight="700">Dynamic STS (Cryptographic PRNG Replay Protected)</tspan></text>

  <!-- 10-Point Compliance Checks List -->
  <text x="635" y="348" font-size="14" font-weight="700" fill="#f8fafc">Normative Ruleset Compliance (10-Point Audit):</text>

  <!-- Rule 1 Pass -->
  <rect x="635" y="365" width="510" height="42" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1" />
  <text x="650" y="391" font-size="12" font-weight="700" fill="#34d399">[PASS] RULE-01: Header bitfield envelope valid (MT=1, PBF=0, Reserved=0x00)</text>

  <!-- Rule 2 Pass -->
  <rect x="635" y="415" width="510" height="42" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1" />
  <text x="650" y="441" font-size="12" font-weight="700" fill="#34d399">[PASS] RULE-02: GID 0x01 &amp; OID 0x03 within standard FiRa registry</text>

  <!-- Rule 3 Pass -->
  <rect x="635" y="465" width="510" height="42" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1" />
  <text x="650" y="491" font-size="12" font-weight="700" fill="#34d399">[PASS] RULE-03: Declared payload length matches wire octets (15 == 15B)</text>

  <!-- Rule 4 Pass -->
  <rect x="635" y="515" width="510" height="42" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1" />
  <text x="650" y="541" font-size="12" font-weight="700" fill="#34d399">[PASS] RULE-05: RF Channel 9 (7987.2 MHz) complies with IEEE 802.15.4z mask</text>

  <!-- Rule 5 Pass -->
  <rect x="635" y="565" width="510" height="42" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1" />
  <text x="650" y="591" font-size="12" font-weight="700" fill="#34d399">[PASS] RULE-07: Dynamic STS (0x02) active (Anti-relay cryptographic protection)</text>

  <!-- Rule 6 Warning / Audit Notice -->
  <rect x="635" y="615" width="510" height="42" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1" />
  <text x="650" y="641" font-size="12" font-weight="700" fill="#34d399">[PASS] RULE-10: Non-destructive configuration frame (Baseband intact)</text>

  <!-- Audit Summary Bar -->
  <rect x="635" y="668" width="510" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="650" y="695" font-size="13" font-weight="700" fill="#f8fafc">Audit Score: 10/10 Passed (0 Violations, 0 Warnings)</text>
  <text x="650" y="715" font-size="11" fill="#94a3b8">FiRa Consortium &amp; IEEE 802.15.4z Specification Conformance: 100% Verified</text>
</svg>
